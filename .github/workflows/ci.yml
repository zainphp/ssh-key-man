name: CI
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check
        required: false
        type: string
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test release publishing
        run: python3 tests/release.py
      - name: Check out source for CI
        if: inputs.ref != '' && inputs.ref != github.ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install ssh-copy-id on macOS
        if: runner.os == 'macOS'
        run: brew install ssh-copy-id
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check code
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --locked
      - name: Test installer and CLI updates
        run: python3 tests/install.py target/debug/skm
      - name: Check terminal workflows
        run: python3 tests/terminal.py
      - name: Build both binaries
        run: cargo build --release --locked
